[project]
name = "voice-drive-thru-agent"
version = "0.1.0"
description = "Voice-enabled drive-thru ordering agent with Deepgram STT/TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "deepgram-sdk>=5.3.2",
    "fastapi>=0.128.0",
    "fastmcp>=2.14.4",
    "httpx>=0.27.0",
    "langchain>=1.2.7",
    "langchain-google-genai>=4.2.0",
    "langchain-groq>=1.1.1",
    "langgraph>=1.0.7",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pydantic-settings>=2.8.1",
    "pyqt6>=6.6.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "structlog>=25.5.0",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1",
]
